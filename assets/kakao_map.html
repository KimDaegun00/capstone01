<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>KaKaoMap 통합 필터 예제</title>
    <style>
        #map { width: 100%; height: 100vh; }

        /* 필터 토글 버튼 */
        #filterToggleBtn {
          position: fixed;
          top: 10px;
          right: 10px;
          background: #007bff;
          color: white;
          border: none;
          border-radius: 4px;
          padding: 5px 10px;
          cursor: pointer;
          z-index: 1300;
        }

        /* 필터 컨테이너 */
        #filterContainer {
          position: fixed;
          top:0; left:0; right:0;
          background:#fff;
          box-shadow:0 2px 6px rgba(0,0,0,0.2);
          z-index:1200;
          font-family:Arial,sans-serif;
          padding:10px;
          overflow:hidden;
          transition: max-height 0.3s ease;
          max-height: 1000px; /* 충분히 큰 값 */
        }
        #filterContainer.collapsed { max-height: 40px; }

        .filterSection { margin-top:10px; overflow:hidden; transition: max-height 0.3s ease; }
        .filterSection label { margin-right:10px; }

        /* 모달 */
        .modal-overlay { position: fixed; top:0; left:0; width:300px; height:100%; background:#fff; box-shadow:2px 0 8px rgba(0,0,0,0.3); display:none; flex-direction:column; padding:20px; z-index:1000; overflow-y:auto; font-family:Arial,sans-serif; }
        .modal-content { position: relative; background:none; box-shadow:none; padding:0; width:100%; border-radius:0; }
        .modal-close { position:absolute; top:8px; right:8px; cursor:pointer; font-weight:bold; font-size:22px; border:none; background:none; }

        /* 내 위치 버튼 */
        #myLocationBtn { position: fixed; bottom:30px; right:30px; width:50px; height:50px; background:white; border-radius:50%; box-shadow:0 2px 6px rgba(0,0,0,0.3); cursor:pointer; display:flex; justify-content:center; align-items:center; z-index:1100; transition: background 0.3s; }
        #myLocationBtn:hover { background:#e0e0e0; }
        #myLocationBtn svg { width:24px; height:24px; fill:#333; }
    </style>
</head>
<body>
<div id="map"></div>

<button id="filterToggleBtn">필터</button>

<div id="filterContainer">
    <div class="filterSection">
        <strong>카테고리 선택:</strong>
        <label><input type="radio" name="mainCategory" value="play" /> 놀이시설</label>
        <label><input type="radio" name="mainCategory" value="nursing" /> 수유실</label>
        <label><input type="radio" name="mainCategory" value="kindergarten" /> 어린이집</label>
    </div>

    <!-- 놀이시설 필터 -->
    <div id="playFilters" class="filterSection" style="max-height:0;">
        <div>
            <strong>실내/실외:</strong>
            <label><input type="radio" name="playIndoorOutdoor" value="" checked /> 전체</label>
            <label><input type="radio" name="playIndoorOutdoor" value="실내" /> 실내</label>
            <label><input type="radio" name="playIndoorOutdoor" value="실외" /> 실외</label>
        </div>
        <div>
            <strong>물놀이시설:</strong>
            <label><input type="radio" name="playWater" value="" checked /> 전체</label>
            <label><input type="radio" name="playWater" value="포함" /> 포함</label>
            <label><input type="radio" name="playWater" value="미포함" /> 미포함</label>
        </div>
        <button id="playSearchBtn">놀이시설 검색</button>
    </div>

    <!-- 수유실 필터 -->
    <div id="nursingFilters" class="filterSection" style="max-height:0;">
        <strong>아빠 이용 가능 여부:</strong>
        <label><input type="radio" name="fatherUse" value="" checked /> 전체</label>
        <label><input type="radio" name="fatherUse" value="아빠이용가능" /> 가능</label>
        <label><input type="radio" name="fatherUse" value="아빠이용불가" /> 불가능</label>
        <button id="nursingSearchBtn">수유실 검색</button>
    </div>

    <!-- 어린이집 필터 -->
    <div id="kindergartenFilters" class="filterSection" style="max-height:0;">
        <p>필요한 하위 필터 입력 가능</p>
        <button id="kindergartenSearchBtn">어린이집 검색</button>
    </div>
</div>

<!-- 모달 -->
<div id="modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalBuilding">
    <div class="modal-content">
        <button id="modalClose" class="modal-close" aria-label="닫기">&times;</button>
        <h2 id="modalBuilding">건물명</h2>
        <p><strong>지역:</strong> <span id="modalRegion"></span></p>
        <p><strong>설명:</strong> <span id="modalDescription"></span></p>
    </div>
</div>

<!-- 내 위치 버튼 -->
<div id="myLocationBtn" title="내 위치로 이동">
    <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm0-6c.552 0 1 .448 1 1v2.07a7.008 7.008 0 014.95 4.95H20c.552 0 1 .448 1 1s-.448 1-1 1h-2.05a7.008 7.008 0 01-4.95 4.95V19c0 .552-.448 1-1 1s-1-.448-1-1v-2.05a7.008 7.008 0 01-4.95-4.95H4c-.552 0-1-.448-1-1s.448-1 1-1h2.05a7.008 7.008 0 014.95-4.95V3c0-.552.448-1 1-1z"/></svg>
</div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ce6c56a1529590b6877c8eaef7a029c3"></script>
<script>
    const map = new kakao.maps.Map(document.getElementById("map"), { center: new kakao.maps.LatLng(33.450701, 126.570667), level: 3 });
    let markers = [];
    const modal = document.getElementById("modal");
    const modalBuilding = document.getElementById("modalBuilding");
    const modalRegion = document.getElementById("modalRegion");
    const modalDescription = document.getElementById("modalDescription");

    document.getElementById("modalClose").addEventListener("click", ()=>modal.style.display="none");

    function clearMarkers(){ markers.forEach(m=>m.setMap(null)); markers=[]; }

    function updatePlayMarkers(data){
      clearMarkers();
      const markerImage = new kakao.maps.MarkerImage(
        'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',
        new kakao.maps.Size(24,35),
        {offset:new kakao.maps.Point(12,35)}
      );
      data.forEach(item=>{
        const position = new kakao.maps.LatLng(Number(item.gpsLat), Number(item.gpsLong));
        const marker = new kakao.maps.Marker({position, image: markerImage, title: item.name});
        marker.setMap(map);
        markers.push(marker);
        kakao.maps.event.addListener(marker, "click", ()=>{
          modalBuilding.textContent = item.name;
          modalRegion.textContent = item.address;
          modalDescription.textContent = `실내/실외: ${item.idrodrCdNm} / 물놀이시설: ${item.wowaStylRideCdNm}`;
          modal.style.display="flex";
        });
      });
    }

    function updateNursingMarkers(data){
      clearMarkers();
      const markerImage = new kakao.maps.MarkerImage(
        'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',
        new kakao.maps.Size(24,35),
        {offset:new kakao.maps.Point(12,35)}
      );
      data.forEach(item=>{
        const position = new kakao.maps.LatLng(Number(item.gpsLat), Number(item.gpsLong));
        const marker = new kakao.maps.Marker({position, image: markerImage, title: item.roomName});
        marker.setMap(map);
        markers.push(marker);
        kakao.maps.event.addListener(marker, "click", ()=>{
          modalBuilding.textContent = item.roomName;
          modalRegion.textContent = item.address;
          modalDescription.textContent = `위치: ${item.location} / ${item.fatherUseNm} / 전화: ${item.managerTelNo}`;
          modal.style.display="flex";
        });
      });
    }

    // 내 위치 버튼
    const myLocationBtn = document.getElementById("myLocationBtn");
    myLocationBtn.addEventListener("click", ()=>{
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(pos=>{
          const loc = new kakao.maps.LatLng(pos.coords.latitude,pos.coords.longitude);
          map.setCenter(loc); map.setLevel(3);
          if(window.currentLocationMarker) window.currentLocationMarker.setMap(null);
          window.currentLocationMarker = new kakao.maps.Marker({
            position: loc, map, title:"내 위치", clickable:false,
            image: new kakao.maps.MarkerImage(
              "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png",
              new kakao.maps.Size(24,35),
              {offset:new kakao.maps.Point(12,35)}
            )
          });
        }, ()=>alert("현재 위치를 가져올 수 없습니다."));
      } else alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
    });

    // 필터 토글
    const filterContainer = document.getElementById("filterContainer");
    const filterToggleBtn = document.getElementById("filterToggleBtn");
    filterToggleBtn.addEventListener("click", ()=>{
      filterContainer.classList.toggle("collapsed");
    });

    // 카테고리 선택 시 하위 필터 슬라이드
    function showFilterSection(id){
      document.querySelectorAll("#filterContainer .filterSection").forEach(section=>{
        if(section.id && section.id.endsWith("Filters")){
          section.style.maxHeight = "0";
        }
      });
      const section = document.getElementById(id);
      if(section){
        section.style.maxHeight = section.scrollHeight + "px";
      }
    }

    document.querySelectorAll('input[name="mainCategory"]').forEach(radio=>{
      radio.addEventListener("change", ()=>{
        if(radio.value==="play") showFilterSection("playFilters");
        else if(radio.value==="nursing") showFilterSection("nursingFilters");
        else if(radio.value==="kindergarten") showFilterSection("kindergartenFilters");
      });
    });

    // Edge function 관련 (예시)
    const edgeFunctionUrls = {
      play: "https://kgbglwgpwcczbebmwbbd.supabase.co/functions/v1/response",
      nursing: "https://kgbglwgpwcczbebmwbbd.supabase.co/functions/v1/super-task",
      kindergarten: "https://your-supabase-url/functions/v1/kindergarten"
    };
    const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnYmdsd2dwd2NjemJlYm13YmJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQxNDQzMzYsImV4cCI6MjA2OTcyMDMzNn0.h22t1AHSPEuhaF7N-f_M_zWBGCaU71PiPMcquvbMabw";

    async function fetchAndUpdateMarkers(category, params, updateFunc){
      try{
        const bounds = map.getBounds();
        const sw = bounds.getSouthWest();
        const ne = bounds.getNorthEast();
        const body = {...params, swLat: sw.getLat(), swLng: sw.getLng(), neLat: ne.getLat(), neLng: ne.getLng()};

        const res = await fetch(edgeFunctionUrls[category], {
          method:"POST",
          headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${supabaseAnonKey}` },
          body: JSON.stringify(body)
        });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        updateFunc(data);
      } catch(e){ console.error(e); alert("데이터 로드 실패"); }
    }

    // 검색 버튼
    document.getElementById("playSearchBtn").addEventListener("click", ()=>{
      const indoorOutdoor = document.querySelector('input[name="playIndoorOutdoor"]:checked').value;
      const water = document.querySelector('input[name="playWater"]:checked').value;
      fetchAndUpdateMarkers("play", {idrodrCdNm: indoorOutdoor, wowaStylRideCdNm: water}, updatePlayMarkers);
    });
    document.getElementById("nursingSearchBtn").addEventListener("click", ()=>{
      const fatherUse = document.querySelector('input[name="fatherUse"]:checked').value;
      fetchAndUpdateMarkers("nursing", {fatherUse}, updateNursingMarkers);
    });
    document.getElementById("kindergartenSearchBtn").addEventListener("click", ()=>{
      fetchAndUpdateMarkers("kindergarten", {}, updatePlayMarkers);
    });
</script>
</body>
</html>
